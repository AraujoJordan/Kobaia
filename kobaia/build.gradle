plugins {
    id 'com.android.library'
    id 'jacoco'
    id 'com.vanniktech.maven.publish'
}

jacoco {
    toolVersion = '0.8.13'
}

android {
    namespace 'com.araujo.jordan.kobaia'
    compileSdk 37

    defaultConfig {
        minSdk 23
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        debug {
            // Instruments the library so the sample's instrumented tests can report on it
            enableAndroidTestCoverage true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'InvalidPackage'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    api 'androidx.test:runner:1.7.0'
    api 'androidx.test:core:1.7.0'
    api 'androidx.test:rules:1.7.0'
    api 'androidx.test.espresso:espresso-core:3.7.0'
    api 'androidx.test.uiautomator:uiautomator:2.4.0'
    api 'junit:junit:4.13.2'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
}

// Coverage of the library comes from the sample's instrumented tests: they are the only tests
// that exercise it, since every interaction needs a device. So the execution data is written into
// the sample's build directory during the connected run, while the classes and sources being
// measured are this module's.
tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn ':sample:connectedDebugAndroidTest'

    reports {
        xml.required = true
        html.required = true
    }

    def generatedClasses = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*'
    ]

    // AGP 9 compiles Kotlin itself and writes to built_in_kotlinc; the kotlin-classes path is
    // where the separate Kotlin plugin used to put them. Both are listed so the report keeps
    // working either way, and a directory that does not exist simply contributes nothing.
    def compiledClasses = [
        'intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes',
        'tmp/kotlin-classes/debug',
        'intermediates/javac/debug/compileDebugJavaWithJavac/classes'
    ].collect { path ->
        fileTree(dir: layout.buildDirectory.dir(path).get().asFile, excludes: generatedClasses)
    }

    classDirectories.setFrom(files(compiledClasses))
    sourceDirectories.setFrom(files('src/main/java'))

    // Pulled off the device by connectedDebugAndroidTest, one file per device that ran
    executionData.setFrom(
        fileTree(
            dir: rootProject.file('sample/build/outputs/code_coverage/debugAndroidTest/connected'),
            includes: ['**/*.ec']
        )
    )
}

// Exclude Kotlin files from Javadoc due to an error generating docs from Kotlin files.
// More info: https://github.com/novoda/bintray-release/issues/71
tasks.withType(Javadoc).configureEach {
    excludes = ['**/*.kt']
}

mavenPublishing {
    coordinates(
        project.findProperty("GROUP") ?: "io.github.araujojordan",
        project.findProperty("POM_ARTIFACT_ID") ?: "kobaia",
        project.findProperty("VERSION_NAME") ?: "0.4.2"
    )

    pom {
        name = "Kobaia"
        description = "The Android UI test library that reads like the test you would describe out loud."
        inceptionYear = "2020"
        url = "https://github.com/AraujoJordan/Kobaia"
        licenses {
            license {
                name = "The MIT License"
                url = "https://opensource.org/licenses/MIT"
                distribution = "repo"
            }
        }
        developers {
            developer {
                id = "AraujoJordan"
                name = "Jordan L. Araujo Jr"
                url = "https://github.com/AraujoJordan"
            }
        }
        scm {
            url = "https://github.com/AraujoJordan/Kobaia"
            connection = "scm:git:git://github.com/AraujoJordan/Kobaia.git"
            developerConnection = "scm:git:ssh://github.com/AraujoJordan/Kobaia.git"
        }
    }

    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()
}

signing {
    required {
        (project.hasProperty("signingInMemoryKey") || project.hasProperty("signing.keyId") || System.getenv("SIGNING_KEY") != null) &&
            !project.version.toString().endsWith("SNAPSHOT")
    }
}


