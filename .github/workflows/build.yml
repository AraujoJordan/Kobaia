name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A second push to the same branch makes the first one's emulator run pointless, and an emulator
# run is the most expensive thing in this file.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the library and the sample app
        run: ./gradlew build

  instrumented-tests:
    name: Instrumented tests and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Without this the emulator falls back to software rendering and takes minutes to boot
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Booting a fresh AVD is most of this job's wall clock. Cached, the emulator restores from a
      # snapshot instead, and the cold boot is paid once per api-level rather than once per push.
      - name: Cache the AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64

      - name: Create the AVD and snapshot it
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated."

      # Kobaia's tests are the sample's instrumented tests: every interaction needs a device, so
      # this is the only place the library is actually exercised, and the only source of coverage.
      - name: Run the sample's instrumented tests and report coverage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Kobaia photographs every failed attempt into the app's external media directory. Those
          # files are the difference between "the assertion failed" and knowing what was on screen
          # instead, so they are pulled off the emulator before it is thrown away — and pulled
          # whatever the tests did, since a red run is exactly when they are worth having.
          script: |
            ./gradlew :kobaia:jacocoTestReport || TEST_RESULT=$?
            mkdir -p sample/build/reports/failure-screenshots
            adb pull /sdcard/Android/media/com.araujo.jordan.kobaia sample/build/reports/failure-screenshots || true
            exit ${TEST_RESULT:-0}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: kobaia/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          # The build should not go red because the coverage upload had a bad day
          fail_ci_if_error: false

      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            sample/build/reports/androidTests/
            sample/build/reports/failure-screenshots/
            sample/build/outputs/androidTest-results/
          if-no-files-found: ignore
