name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build and report coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the library and the sample app
        run: ./gradlew build

      - name: Report unit test coverage
        run: ./gradlew :kobaia:jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: kobaia/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          # The build should not go red because the coverage upload had a bad day
          fail_ci_if_error: false
